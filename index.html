<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <header>
    <div class="container row">
        <div class="brand">
            <div class="logo"></div>
            <div class="title">CODE EDITOR - Live in the browser</div>
        </div>

        <div class="menu-items row">
            <button class="btn secondary" id="saveBtn" title="save work locally"><span>Save</span></button>
            <button class="btn secondary" id="loadBtn" title="load work file"><span>Load</span></button>

            <!-- input file -->
             <input id="openFile" type="file" accept="application/json" hidden />
        </div>
    </div>
   </header>
   
   <main>
    <aside class="card panel stack">
        <h2>Task / Assignment</h2>
        <textarea id="assignment" class="text" placeholder="Task description..."></textarea>

        <div class="stack">
            <label for="textArea">Validation tests (JS only)</label>
            <textarea id="textArea" class="text" placeholder="Write tests here..."></textarea>
        </div>

        <div class="muted">
            Tip: 
            <span class="kbd">Ctrl</span> + <span class="kbd">S</span> to save 
            <br />
            <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run.
        </div>
    </aside>
   </main>
</body>
</html>
